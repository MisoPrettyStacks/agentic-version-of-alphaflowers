name: Autonomous Data Scanning Agent

on:
  schedule:
    # Triggers at minute 17 of every single hour to bypass top-of-hour platform delays
    - cron: '17 * * * *'
  workflow_dispatch: # Retains a button in the UI allowing you to manually trigger scans instantly

permissions:
  contents: write # Grants the server token explicit access to update your repository files

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Agent Intelligence Routine
        run: python scanner.py

      - name: Push Updates to GitHub Pages Matrix
        run: |
          git config --global user.name "GitHub Automation Agent"
          git config --global user.email "actions@github.com"
          git add data.json
          # Only proceed with a commit update if data.json reflects modified evaluations
          git diff-index --quiet HEAD || git commit -m "🤖 Autonomous Scan Refresh [Skip CI]"
          git push
